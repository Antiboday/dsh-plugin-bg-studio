<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh web wallpaper demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #bg {
    position: absolute; inset: -10%;
    background: linear-gradient(120deg, #1c2a4a, #3d2a5a, #14243a);
    background-size: 300% 300%;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  #panel {
    position: absolute; left: 24px; bottom: 24px; padding: 14px 20px;
    background: rgba(10, 12, 24, 0.72); color: #e8ecf8; border-radius: 12px;
    font-size: 15px; line-height: 1.6; backdrop-filter: blur(6px);
  }
  #state { font-size: 26px; font-weight: 700; }
  .idle #state { color: #7dd3fc; }
  .busy #state { color: #a3e635; }
  .overloaded #state { color: #fb7185; }
  #meta { opacity: 0.75; font-size: 12px; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="panel">
    <div>WEB WALLPAPER DEMO</div>
    <div id="state">idle</div>
    <div id="meta">activeTasks=0 clip=—</div>
  </div>
<script>
  // The dsh-bg-studio activity bridge contract: state pushes arrive as
  // window message events carrying { source: 'dsh-bg-studio', type: 'activity' }.
  function applyActivity(payload) {
    document.body.className = payload.state;
    document.getElementById('state').textContent = payload.state;
    document.getElementById('meta').textContent =
      'activeTasks=' + (payload.activeTasks ?? '?') + ' clip=' + (payload.idleClip || '—');
  }
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (d && d.source === 'dsh-bg-studio' && d.type === 'activity') applyActivity(d);
  });
</script>
</body>
</html>
